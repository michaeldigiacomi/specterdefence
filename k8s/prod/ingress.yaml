apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: specterdefence-marketing
  namespace: specterdefence
  labels:
    app.kubernetes.io/name: specterdefence
    environment: production
spec:
  ingressClassName: traefik
  rules:
    - host: specterdefence.digitaladrenalin.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: specterdefence-marketing
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: specterdefence-app
  namespace: specterdefence
  labels:
    app.kubernetes.io/name: specterdefence
    environment: production
spec:
  ingressClassName: traefik
  rules:
    - host: app.specterdefence.digitaladrenalin.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: specterdefence-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: specterdefence-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: specterdefence-frontend
                port:
                  number: 80