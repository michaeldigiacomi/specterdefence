[tool.poetry]
packages = [{ include = "src" }]
name = "specterdefence"
version = "0.1.0"
description = "Microsoft 365 security posture monitoring and management"
authors = ["michaeldigiacomi"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.3"
sqlalchemy = "^2.0.30"
asyncpg = "^0.29.0"
pydantic = "^2.8.2"
python-dotenv = "^1.0.1"
alembic = "^1.13.3"
pytest = ">=8.2,<10.0.0"
pytest-asyncio = "^0.24.0"
httpx = ">=0.27.0"
python-whois = "^0.9.0"
cryptography = "^43.0.0"
slowapi = "^0.1.9"

# Optional: only needed to run the MCP server (mcp_server/), not the backend.
[tool.poetry.group.mcp]
optional = true

[tool.poetry.group.mcp.dependencies]
mcp = "^1.10"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^5.0.0"
flake8 = "^7.1.0"
black = "^24.8.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-v --tb=short --ignore=scripts"
testpaths = ["tests"]
env = [
    "DATABASE_URL=sqlite:///:memory:",
    "TESTING=true"
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80

# Per-file coverage thresholds for critical modules
[tool.coverage.paths]
source = ["src"]

# Ruff linter configuration
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PIE", "SIM", "RUF"]
ignore = ["E501", "E203"]

# MyPy strict mode
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true